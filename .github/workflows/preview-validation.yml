name: Validate appearance drag improvements
on:
  push:
    branches: [perf/preview-speed]
    paths: [src/**, tests/**, .github/workflows/preview-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - run: pnpm check
      - name: Verify drag saving in the development build
        run: pnpm exec playwright test tests/appearance-drag.spec.ts --browser webkit --workers 1
      - name: Compare native bridge calls with 150 visible albums
        env:
          PREVIEW_ADOPTION: '1'
        run: |
          node experiments/preview/prepare.mjs
          node experiments/preview/fixtures.mjs
          node experiments/preview/bench.mjs
      - run: pnpm build
      - name: Verify production behavior and render synthetic README screenshots
        run: pnpm exec playwright test --config experiments/preview/validation.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-validation
          path: |
            .local/preview-results/*.json
            docs/screenshots/*.webp
            test-results/
