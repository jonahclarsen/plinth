name: Hover quality validation and performance
on:
  push:
    branches: [fix/hover-quality]
    paths: [src/**, tests/**]
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, tests, browser, performance]
        default: all
permissions:
  contents: read
jobs:
  tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'performance' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - run: pnpm check
      - run: pnpm test:music && pnpm test:dev-runner
      - run: pnpm build
      - name: All browser tests
        continue-on-error: true
        run: pnpm exec playwright test --workers 1 --reporter list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - name: Compare full suite with unchanged main
        if: ${{ !cancelled() }}
        run: |
          git fetch origin a051dd1b915ea1099abf5aac29f2e2d001ecad58
          git worktree add "$RUNNER_TEMP/hover-baseline" a051dd1b915ea1099abf5aac29f2e2d001ecad58
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/hover-baseline/node_modules"
          mkdir -p .local/hover-results
          cd "$RUNNER_TEMP/hover-baseline"
          PLAYWRIGHT_JSON_OUTPUT_NAME="$GITHUB_WORKSPACE/.local/hover-results/baseline-tests.json" pnpm exec playwright test --workers 1 --reporter list,json || true
          cd "$GITHUB_WORKSPACE"
          node experiments/hover-quality/compare-tests.mjs
      - name: Native tests
        if: ${{ !cancelled() && inputs.scope != 'browser' }}
        run: pnpm test:native
      - name: Standalone build
        if: ${{ !cancelled() && inputs.scope != 'browser' }}
        run: pnpm build:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hover-validation
          path: |
            test-results/
            .local/hover-results/*.json
            docs/screenshots/*.webp
            src-tauri/target/release/bundle/macos/*.app
  performance:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'tests' }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - name: Alternating old and new WebKit measurements
        run: node experiments/hover-quality/bench.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hover-performance
          path: .local/hover-results/*.json
