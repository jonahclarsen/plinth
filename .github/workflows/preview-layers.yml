name: Measure focused preview candidates
on:
  push:
    branches: [perf/preview-speed]
    paths: [.github/workflows/preview-layers.yml]
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [layers, cells]
        default: layers
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PREVIEW_FOCUSED: ${{ inputs.experiment || 'cells' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - run: node experiments/preview/prepare.mjs
      - name: Check generated variants
        run: |
          for variant in .local/preview/*; do
            pnpm exec svelte-check --workspace "$variant" --tsconfig ./tsconfig.json
          done
      - run: node experiments/preview/fixtures.mjs
      - run: node experiments/preview/bench.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-layer-results
          path: .local/preview-results/*.json
