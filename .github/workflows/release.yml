name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign and notarize without publishing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.notarize == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Check version matches tag
        if: env.RELEASE == 'true'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in "$(node -p "require('./package.json').version")" \
                   "$(node -p "require('./src-tauri/tauri.conf.json').version")"; do
            case "$v" in "$tag"|"$tag.0") ;; *) echo "Version $v does not match tag $GITHUB_REF_NAME"; exit 1;; esac
          done
      - run: pnpm check
      - run: pnpm test:native
      - name: Import signing certificate
        if: env.SIGN == 'true'
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed s/\"//g)
          security find-identity -v -p codesigning "$keychain"
          printf '%s' "$NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Gabgren 2000 Inc. (9TJ9D565BJ)"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
      - name: Build universal app
        env:
          APPLE_API_KEY: ${{ env.SIGN == 'true' && secrets.NOTARY_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.SIGN == 'true' && secrets.NOTARY_ISSUER_ID || '' }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Verify and package
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/Plinth.app"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir -p out
          if [ "$SIGN" = true ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose "$app"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "out/Plinth_${version}_universal.zip"
          dmg="$(ls "$bundle"/dmg/*.dmg)"
          if [ "$SIGN" = true ]; then
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
              --key-id "${{ secrets.NOTARY_KEY_ID }}" --issuer "${{ secrets.NOTARY_ISSUER_ID }}" --wait --timeout 30m
            xcrun stapler staple "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          fi
          cp "$dmg" "out/Plinth_${version}_universal.dmg"
          (cd out && shasum -a 256 * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: plinth-macos
          path: out/*
      - name: Publish release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "Plinth $GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
