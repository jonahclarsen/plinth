name: Validate measured performance changes
on:
  push:
    branches: [perf/adopt-measured]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ADOPTION_BASE: cb831bc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - run: node experiments/performance/adoption.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adoption-results
          path: |
            .local/performance/*.json
            docs/screenshots/*.webp
          retention-days: 30
